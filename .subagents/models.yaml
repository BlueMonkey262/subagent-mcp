# Optional server limits. Defaults: maxConcurrent 12, codexResumeIdleSeconds 1800.
# maxConcurrent: 12
# codexResumeIdleSeconds: 1800
# allowances:
#   cursor:
#     maxSpawns: 20
#     maxCostUsd: 5
# Refuse agents before they start (README: "Blocking backends and models"). Invalid live edits
# pause execution until fixed. Each setting also has an
# environment variable for every project: SUBAGENT_MCP_DISABLED_BACKENDS, SUBAGENT_MCP_BLOCK_MODELS,
# SUBAGENT_MCP_BLOCK_CLAUDE_MODELS.
# disabledBackends: [antigravity]
# blockModels: ["*grok*", "codex:gpt-5.6-sol"]
# blockClaudeModels: true   # Claude subagents go through Claude Code's own Agent tool instead
# Per-provider guard for OpenCode `provider/model` ids (README: "Provider limits"): at most
# maxConcurrent agents on that provider at once, and after a turn fails on a recognized rate limit,
# new turns for it wait cooldownSeconds (±20% jitter). OpenCode retries single requests itself.
# providerLimits:
#   mistral:
#     maxConcurrent: 2
#     cooldownSeconds: 60

models:
  claude:
    - name: claude-sonnet-5
      description: Balanced default for most delegated work
    - name: claude-opus-5
      description: Highest capability, slower and more expensive
    - name: claude-haiku-4-5-20251001
      description: Fast and cheap for narrow, well-scoped tasks
  codex:
    - name: gpt-5.6-sol
      description: Codex CLI default model
    - name: gpt-5.6-luna
      description: Fast and affordable agentic coding model
    # Mistral API (pay-as-you-go) runs through OpenCode, not Codex; see the opencode section.
    # Endpoint models (NVIDIA NIM, any OpenAI-compatible URL) are added automatically from
    # `subagent-mcp endpoint add ...` as "<endpoint>/<alias>" in the claude, codex and opencode rosters.
    # Policy checks both that alias and the endpoint's upstream model id.
  opencode:
    - name: ollama-cloud/gpt-oss:20b
      description: >-
        OpenCode model IDs are "provider/model" (matching config/providers). Run
        `opencode models` to see what's configured locally, then add entries here.
    # Mistral API models (pay-as-you-go) after connecting Mistral in OpenCode; `opencode models`
    # lists the `mistral/...` ids your key can run. Limit them with `providerLimits.mistral`. E.g.:
    # - name: mistral/mistral-medium-latest
    # - name: mistral/codestral-latest
  antigravity:
    - name: gemini-3.8-flash-low
      description: Fast, low-effort Gemini 3.8 Flash tier from `agy models`.
    - name: gemini-3.8-flash-medium
      description: Medium-effort Gemini 3.8 Flash tier from `agy models`.
    - name: gemini-3.8-flash-high
      description: Higher-reasoning Gemini 3.8 Flash tier from `agy models`.
  cursor:
    # Cursor Agent CLI model ids are the exact values from `agent --list-models`.
    # `auto` is the CLI default; effort is folded into the id (e.g. grok-4.7-high).
    - name: auto
      description: Cursor Agent CLI default model routing (`agent --list-models` for the full roster).
  copilot:
    # GitHub Copilot CLI model ids as `copilot --model` accepts them. Which ones run depends on your
    # Copilot plan and model settings; `auto` routes to a model your plan allows.
    - name: auto
      description: Copilot routes each request to a model your plan allows (rejects effort).
  vibe:
    # Mistral Vibe model aliases (`vibe` then /model lists them; `list_models` shows them after one
    # Vibe run). Vibe uses its own login (`vibe --setup`); thinking is set per alias, not by effort.
    - name: mistral-medium-3.5
      description: Mistral Medium 3.5 through Vibe (plan or API key); Vibe's default coding model.
    - name: zai-glm-5-3-flash
      description: GLM-5.3 Flash hosted by Mistral through Vibe; fast, priced at zero in Vibe's table.
